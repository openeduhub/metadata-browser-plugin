<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLO Extension</title>
    <link rel="stylesheet" href="../styles/sidebar.css">
    <link rel="stylesheet" href="../styles/popup.css">
    <link rel="stylesheet" href="../styles/warenkorb.css">
    <link rel="stylesheet" href="../styles/web-component/styles.css">
</head>
<body>
    <div class="sidebar-container">
        <!-- Tab Navigation -->
        <div class="sidebar-tabs">
            <button class="sidebar-tab-btn active" data-tab="publish">
                📤 Publizieren
            </button>
            <button class="sidebar-tab-btn" data-tab="warenkorb">
                🛒 Warenkorb
            </button>
        </div>

        <!-- Tab Content -->
        <div class="sidebar-content">
            <!-- Warenkorb Tab -->
            <div id="warenkorb-tab" class="sidebar-tab-content">
                <div id="warenkorb-sidebar">
                    <div class="wk-header">
                        <h1>🛒 Pädagogischer Warenkorb</h1>
                        <p>Unterrichtsplanung mit WLO-Inhalten</p>
                    </div>

                    <div class="wk-search-link">
                        <input type="text" id="wk-search-input" placeholder="Suchbegriff eingeben...">
                        <button id="wk-search-btn" title="In WLO suchen">🔍 Suchen</button>
                    </div>

                    <div class="wk-pattern-selector">
                        <label>Ablaufmuster</label>
                        <select id="wk-pattern-select">
                            <!-- Optionen werden dynamisch eingefügt -->
                        </select>
                    </div>

                    <div class="wk-phases" id="wk-phases-container">
                        <!-- Phasen werden dynamisch eingefügt -->
                    </div>

                    <div class="wk-footer">
                        <button class="wk-btn wk-btn-secondary" id="wk-clear-btn">
                            🗑️ Leeren
                        </button>
                        <button class="wk-btn wk-btn-primary" id="wk-export-btn">
                            📄 Export
                        </button>
                    </div>
                </div>
            </div>

            <!-- Publish Tab -->
            <div id="publish-tab" class="sidebar-tab-content active">
                <div class="container">
                    <img src="../images/logo.svg" alt="WLO Logo" class="wlo-logo">

                    <div class="button-container">
                        <button id="help-btn">🦉 Kann ich helfen?</button>
                        <button id="settings-btn">⚙️ Einstellungen</button>
                    </div>

                    <div class="propose-work-container">
                        <button id="propose-work-btn">📤 Werk vorschlagen</button>
                    </div>

                    <div id="auth-container" class="content hidden">
                        <h2>Login</h2>
                        <p>Bitte melde dich an, um Inhalte zu veröffentlichen.</p>
                        <label for="system-select">System</label>
                        <select id="system-select"></select>
                        <input type="text" id="username" placeholder="Benutzername">
                        <input type="password" id="password" placeholder="Passwort">
                        <button id="login-btn">Anmelden</button>
                        <div id="error-message" class="error-message hidden"></div>
                        <div id="login-success-message" class="success-message hidden">
                            ✅ Erfolgreich eingeloggt!
                        </div>
                        <div class="login-links">
                            <a href="#" id="forgot-password">Passwort vergessen?</a>
                            <a href="#" id="register">Registrieren</a>
                        </div>
                    </div>

                    <div id="main-content" class="content hidden">
                        <div class="content">
                            <h2>Publizieren in 3 Schritten</h2>
                            <p>Ergänze Metadaten und veröffentliche deine Kurse schnell & einfach</p>
                            <img src="../images/wlo_owl.png" alt="WLO Eule" class="owl-img">
                            <button id="start-btn">Start</button>
                        </div>
                    </div>

                    <iframe id="form-frame" class="hidden"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../scripts/patterns.js"></script>
    <script src="../scripts/wlo-api.js"></script>
    <script src="../scripts/pdf-export.js"></script>
    <script src="../scripts/warenkorb.js"></script>
    <script src="../scripts/main.js"></script>
    <script src="../settings/config.js"></script>
    <script type="module" src="../scripts/popup.js"></script>
    <script src="../scripts/web-component/polyfills.js"></script>
    <script type="module" src="../scripts/web-component/main.js"></script>
    <script src="../scripts/sidebar.js"></script>
</body>
</html>
